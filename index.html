<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f0e7" />
  <title>句间 · CET-6 写作表达</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top"><a class="brand" href="#"><span>句间</span><small>WORDS IN CONTEXT</small></a><div class="top-right"><span class="streak">✦ 每天五句，积累成章</span><button id="refresh" class="icon" aria-label="重新载入今日内容">↻</button></div></header>
  <main>
    <section class="intro"><div class="overline"><span class="dot"></span> CET-6 WRITING STUDIO <span id="today"></span></div><h1>让表达，<em>更进一步。</em></h1><p>精选适用于六级作文的中文论述句，练习转化为自然、有层次的英文表达。</p></section>
    <div class="week-nav" id="weekNav" aria-label="选择学习日期"></div>
    <section class="topic-card"><div class="topic-mark" id="topicIndex">01 <span>—</span></div><div class="topic-info"><div class="tag">今日话题</div><h2 id="topic">数字时代与人工智能</h2><p id="topicNote">每日五句，按话题积累六级写作素材。</p></div><div class="topic-progress"><span>本周进度</span><strong id="cycle">第 1 / 7 天</strong><div class="progress"><i id="progress"></i></div></div></section>
    <div class="section-head"><div><span class="label">DAILY SENTENCES</span><h2 id="dayHeading">今日五句</h2></div><span class="hint">点击卡片，查看英文译文与重点词汇</span></div>
    <section id="sentences" class="sentences" aria-live="polite"></section>
    <section class="listening panel" aria-labelledby="listenTitle">
      <div class="listen-head"><div><span class="label">LISTENING PRACTICE</span><h2 id="listenTitle">今日听力</h2></div><span class="level" id="audioLevel">CET-6+</span></div>
      <div class="audio-meta"><h3 id="audioTitle"></h3><p id="audioDesc"></p><audio id="audioPlayer" controls preload="none"></audio><div class="listen-actions"><button id="transcriptToggle" class="transcript-button" aria-expanded="false">显示英文原文　＋</button><a id="audioSource" target="_blank" rel="noopener">打开素材来源 ↗</a></div><div id="transcript" class="transcript" hidden></div></div>
    </section>
    <footer><span>句间 · 把好表达，变成自己的表达。</span><span id="updated">每日更新 · 06:00</span></footer>
  </main>
  <script src="week.js"></script><script src="listening.js"></script><script src="app.js"></script>
</body>
</html>
